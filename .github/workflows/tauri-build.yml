name: Tauri build

on:
  push:
  workflow_dispatch:

concurrency:
  group: tauri-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (NSIS)
            os: windows-2025
            paths: |
              ports/tauri/src-tauri/target/release/bundle/nsis/*.exe
          - name: Linux (deb + AppImage)
            os: ubuntu-24.04
            paths: |
              ports/tauri/src-tauri/target/release/bundle/deb/*.deb
              ports/tauri/src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ports/tauri/src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Build bundles
        working-directory: ports/tauri
        run: npx -p @tauri-apps/cli@2 tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Compositor-${{ matrix.os }}
          path: ${{ matrix.paths }}
          retention-days: 14
          if-no-files-found: error
