name: Tauri build

on:
  push:
  workflow_dispatch:

concurrency:
  group: tauri-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (NSIS)
            os: windows-2025
            paths: |
              ports/tauri/src-tauri/target/release/bundle/nsis/*.exe
          - name: Linux (deb + AppImage)
            os: ubuntu-24.04
            paths: |
              ports/tauri/src-tauri/target/release/bundle/deb/*.deb
              ports/tauri/src-tauri/target/release/bundle/appimage/*.AppImage
          - name: macOS (dmg)
            os: macos-latest
            paths: |
              ports/tauri/src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ports/tauri/src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Build bundles
        working-directory: ports/tauri
        run: npx -p @tauri-apps/cli@2 tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Compositor-${{ matrix.os }}
          path: ${{ matrix.paths }}
          retention-days: 14
          if-no-files-found: error

  # Tag a commit with a v* tag to collect every installer from the matrix
  # above into one GitHub release ready for download.
  release:
    name: Publish installers release
    needs: [desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download bundles
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "${{ github.ref_name }}" dist/* \
            --title "Compositor multi-platform ${{ github.ref_name }}" \
            --generate-notes
