name: Build

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos-app:
    name: macOS app (unsigned)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Resolve Swift packages
        run: >
          xcodebuild -resolvePackageDependencies
          -project Compositor.xcodeproj
          -scheme Compositor
          -onlyUsePackageVersionsFromResolvedFile

      - name: Build Release
        run: >
          xcodebuild build
          -project Compositor.xcodeproj
          -scheme Compositor
          -destination 'platform=macOS,arch=arm64'
          -configuration Release
          -derivedDataPath DerivedData
          CODE_SIGN_IDENTITY=-
          CODE_SIGNING_REQUIRED=NO

      - name: Package app bundle
        run: |
          cd DerivedData/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent Compositor.app Compositor-macOS.zip
          mv Compositor-macOS.zip "$GITHUB_WORKSPACE"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Compositor-macOS
          path: Compositor-macOS.zip
          retention-days: 14

  platform-layer:
    name: Platform layer on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            swift: "6.1"
          - name: Windows
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Swift (Linux)
        if: runner.os == 'Linux'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ matrix.swift }}

      # setup-swift has no Windows toolchains for recent releases, so install
      # the official NSIS installer directly and put swiftc on PATH. The
      # elevated child process outlives the launcher, hence the polling.
      - name: Cache Swift installer
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\swift-install.exe
          key: swift-6.2.4-windows10-x64

      - name: Set up Swift (Windows)
        if: runner.os == 'Windows'
        run: |
          $installer = "$env:RUNNER_TEMP\swift-install.exe"
          if (-not (Test-Path $installer)) {
            Invoke-WebRequest -Uri 'https://download.swift.org/swift-6.2.4-release/windows10/swift-6.2.4-RELEASE/swift-6.2.4-RELEASE-windows10.exe' -OutFile $installer
          }
          $process = Start-Process -FilePath $installer -ArgumentList '/S' -PassThru
          if (-not $process.WaitForExit(300000)) { $process.Kill(); throw 'Swift installer timed out' }
          "Installer exit code: $($process.ExitCode)"
          $bin = $null
          $deadline = (Get-Date).AddMinutes(5)
          while (-not $bin -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 10
            $bin = Get-ChildItem "$env:SystemDrive\Library" -Recurse -Filter 'swiftc.exe' -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty DirectoryName
          }
          if (-not $bin) {
            if (Test-Path "$env:SystemDrive\Library") {
              Get-ChildItem "$env:SystemDrive\Library" -Recurse -Depth 3 -ErrorAction SilentlyContinue |
                Select-Object -First 40 -ExpandProperty FullName
            }
            throw 'swiftc.exe not found after install'
          }
          Add-Content $env:GITHUB_PATH $bin

      # The platform layer must stay Foundation-only so the port effort in
      # docs/PORTING.md can compile the core on every OS. Typechecking it
      # here keeps that promise visible on every push.
      - name: Typecheck platform layer
        run: swiftc -typecheck Compositor/Platform/Platform.swift
